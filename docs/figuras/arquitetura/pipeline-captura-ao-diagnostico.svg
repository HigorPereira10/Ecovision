<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1090" width="800" height="1090" font-family="Arial, Helvetica, sans-serif"><defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/></marker><marker id="setai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/></marker></defs><rect width="800" height="1090" fill="#ffffff"/><rect x="10" y="10" width="780" height="364" rx="10" fill="#fdf3e6" stroke="#a65f1c" stroke-width="1.8"/><text x="248" y="38" font-size="17" text-anchor="start" style="white-space:pre"><tspan fill="#1b2733" font-weight="bold">DISPOSITIVO</tspan><tspan fill="#4a5563">   Raspberry Pi 3 Model B+</tspan></text><text x="34" y="64" font-size="15" text-anchor="start" fill="#a65f1c" style="white-space:pre" font-weight="bold">Ciclo de imagem, a cada 2 h</text><text x="470" y="64" font-size="15" text-anchor="start" fill="#a65f1c" style="white-space:pre" font-weight="bold">Ciclo de sensores, a cada 15 min</text><rect x="34" y="76" width="400" height="38" rx="6" fill="#ffffff" stroke="#a65f1c" stroke-width="1.6"/><text x="234.0" y="101" font-size="15.5" text-anchor="middle" fill="#1b2733" style="white-space:pre">1. Lê os sensores</text><rect x="34" y="126" width="400" height="38" rx="6" fill="#ffffff" stroke="#a65f1c" stroke-width="1.6"/><text x="234.0" y="151" font-size="15.5" text-anchor="middle" fill="#1b2733" style="white-space:pre">2. Aciona o LED</text><rect x="34" y="176" width="400" height="38" rx="6" fill="#ffffff" stroke="#a65f1c" stroke-width="1.6"/><text x="234.0" y="201" font-size="15.5" text-anchor="middle" fill="#1b2733" style="white-space:pre">3. Captura a foto (4608 × 2592)</text><rect x="34" y="226" width="400" height="38" rx="6" fill="#ffffff" stroke="#a65f1c" stroke-width="1.6"/><text x="234.0" y="251" font-size="15.5" text-anchor="middle" fill="#1b2733" style="white-space:pre">4. Recomprime em JPEG</text><rect x="34" y="276" width="400" height="38" rx="6" fill="#ffffff" stroke="#a65f1c" stroke-width="1.6"/><text x="234.0" y="301" font-size="15.5" text-anchor="middle" fill="#1b2733" style="white-space:pre">5. Grava na fila local</text><polyline points="234.0,114 234.0,125" fill="none" stroke="#1b2733" stroke-width="1.6" marker-end="url(#seta)"/><polyline points="234.0,164 234.0,175" fill="none" stroke="#1b2733" stroke-width="1.6" marker-end="url(#seta)"/><polyline points="234.0,214 234.0,225" fill="none" stroke="#1b2733" stroke-width="1.6" marker-end="url(#seta)"/><polyline points="234.0,264 234.0,275" fill="none" stroke="#1b2733" stroke-width="1.6" marker-end="url(#seta)"/><rect x="34" y="326" width="400" height="38" rx="6" fill="#fdf3e6" stroke="#a65f1c" stroke-width="1.6"/><text x="234.0" y="351" font-size="15.5" text-anchor="middle" fill="#1b2733" style="white-space:pre" font-weight="bold">POST /diagnostico: imagem e leituras</text><polyline points="234.0,314 234.0,325" fill="none" stroke="#1b2733" stroke-width="1.6" marker-end="url(#seta)"/><rect x="470" y="76" width="250" height="38" rx="6" fill="#ffffff" stroke="#a65f1c" stroke-width="1.6"/><text x="595.0" y="101" font-size="15.5" text-anchor="middle" fill="#1b2733" style="white-space:pre">Lê os sensores</text><rect x="470" y="126" width="250" height="38" rx="6" fill="#fdf3e6" stroke="#a65f1c" stroke-width="1.6"/><text x="595.0" y="151" font-size="15.5" text-anchor="middle" fill="#1b2733" style="white-space:pre" font-weight="bold">POST /leituras: sem imagem</text><polyline points="595.0,114 595.0,125" fill="none" stroke="#1b2733" stroke-width="1.6" marker-end="url(#seta)"/><text x="474" y="192" font-size="14" text-anchor="start" fill="#4a5563" style="white-space:pre" font-style="italic">Os dois ciclos usam uma trava</text><text x="474" y="210" font-size="14" text-anchor="start" fill="#4a5563" style="white-space:pre" font-style="italic">de arquivo para não disputar</text><text x="474" y="228" font-size="14" text-anchor="start" fill="#4a5563" style="white-space:pre" font-style="italic">o sensor DHT22.</text><rect x="10" y="408" width="780" height="480" rx="10" fill="#e5f3f2" stroke="#1d7373" stroke-width="1.8"/><text x="248" y="436" font-size="17" text-anchor="start" style="white-space:pre"><tspan fill="#1b2733" font-weight="bold">NUVEM</tspan><tspan fill="#4a5563">   FastAPI no Railway, Supabase PostgreSQL e Storage</tspan></text><rect x="34" y="452" width="400" height="38" rx="6" fill="#ffffff" stroke="#1d7373" stroke-width="1.6"/><text x="234.0" y="477" font-size="15.5" text-anchor="middle" fill="#1b2733" style="white-space:pre">6. Autentica o dispositivo</text><rect x="34" y="502" width="400" height="38" rx="6" fill="#ffffff" stroke="#1d7373" stroke-width="1.6"/><text x="234.0" y="527" font-size="15.5" text-anchor="middle" fill="#1b2733" style="white-space:pre">7. Verifica a idempotência</text><rect x="34" y="552" width="400" height="38" rx="6" fill="#e5f3f2" stroke="#1d7373" stroke-width="1.6"/><text x="234.0" y="577" font-size="15.5" text-anchor="middle" fill="#1b2733" style="white-space:pre" font-weight="bold">8. Guarda de qualidade da imagem</text><rect x="34" y="618" width="400" height="38" rx="6" fill="#ffffff" stroke="#1d7373" stroke-width="1.6"/><text x="234.0" y="643" font-size="15.5" text-anchor="middle" fill="#1b2733" style="white-space:pre">9. Recorta janelas de 896 pixels</text><rect x="34" y="668" width="400" height="38" rx="6" fill="#ffffff" stroke="#1d7373" stroke-width="1.6"/><text x="234.0" y="693" font-size="15.5" text-anchor="middle" fill="#1b2733" style="white-space:pre">10. Classifica cada janela (TFLite)</text><rect x="34" y="718" width="400" height="38" rx="6" fill="#ffffff" stroke="#1d7373" stroke-width="1.6"/><text x="234.0" y="743" font-size="15.5" text-anchor="middle" fill="#1b2733" style="white-space:pre">11. Classe mais severa com 20% das janelas</text><rect x="34" y="768" width="400" height="38" rx="6" fill="#ffffff" stroke="#1d7373" stroke-width="1.6"/><text x="234.0" y="793" font-size="15.5" text-anchor="middle" fill="#1b2733" style="white-space:pre">12. Grava imagem e registros</text><rect x="34" y="818" width="400" height="38" rx="6" fill="#ffffff" stroke="#1d7373" stroke-width="1.6"/><text x="234.0" y="843" font-size="15.5" text-anchor="middle" fill="#1b2733" style="white-space:pre">13. Gera alertas de diagnóstico e ambientais</text><polyline points="234.0,490 234.0,501" fill="none" stroke="#1b2733" stroke-width="1.6" marker-end="url(#seta)"/><polyline points="234.0,540 234.0,551" fill="none" stroke="#1b2733" stroke-width="1.6" marker-end="url(#seta)"/><polyline points="234.0,656 234.0,667" fill="none" stroke="#1b2733" stroke-width="1.6" marker-end="url(#seta)"/><polyline points="234.0,706 234.0,717" fill="none" stroke="#1b2733" stroke-width="1.6" marker-end="url(#seta)"/><polyline points="234.0,756 234.0,767" fill="none" stroke="#1b2733" stroke-width="1.6" marker-end="url(#seta)"/><polyline points="234.0,806 234.0,817" fill="none" stroke="#1b2733" stroke-width="1.6" marker-end="url(#seta)"/><polyline points="234.0,590 234.0,617" fill="none" stroke="#1b2733" stroke-width="1.6" marker-end="url(#seta)"/><text x="244.0" y="609" font-size="14" text-anchor="start" fill="#2e7d4f" style="white-space:pre" font-style="italic">aprovada</text><rect x="470" y="618" width="250" height="88" rx="6" fill="#fbeceb" stroke="#b4473f" stroke-width="1.6"/><text x="595.0" y="646" font-size="15" text-anchor="middle" fill="#1b2733" style="white-space:pre">Sem diagnóstico: a foto é</text><text x="595.0" y="666" font-size="15" text-anchor="middle" fill="#1b2733" style="white-space:pre">guardada e nenhuma classe</text><text x="595.0" y="686" font-size="15" text-anchor="middle" fill="#1b2733" style="white-space:pre">é afirmada</text><polyline points="434,571.0 595.0,571.0 595.0,617" fill="none" stroke="#b4473f" stroke-width="1.6" marker-end="url(#seta)"/><text x="444" y="564.0" font-size="14" text-anchor="start" fill="#b4473f" style="white-space:pre" font-style="italic">reprovada</text><polyline points="595.0,706 595.0,787.0 435,787.0" fill="none" stroke="#b4473f" stroke-width="1.6" marker-end="url(#seta)"/><rect x="470" y="812" width="250" height="50" rx="6" fill="#ffffff" stroke="#1d7373" stroke-width="1.6"/><text x="595.0" y="831" font-size="15" text-anchor="middle" fill="#1b2733" style="white-space:pre">Grava a leitura e avalia</text><text x="595.0" y="850" font-size="15" text-anchor="middle" fill="#1b2733" style="white-space:pre">os limiares ambientais</text><polyline points="470,837.0 436,837.0" fill="none" stroke="#1b2733" stroke-width="1.6" marker-end="url(#seta)"/><polyline points="234.0,364 234.0,451" fill="none" stroke="#1b2733" stroke-width="2" marker-end="url(#seta)"/><polyline points="720,145.0 754,145.0 754,837.0 722,837.0" fill="none" stroke="#1b2733" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#seta)"/><text x="768" y="613.0" font-size="14" fill="#4a5563" font-style="italic" text-anchor="middle" transform="rotate(90 768 613.0)">leitura sem imagem</text><rect x="10" y="922" width="780" height="158" rx="10" fill="#ecebfb" stroke="#4f4ab3" stroke-width="1.8"/><text x="248" y="950" font-size="17" text-anchor="start" style="white-space:pre"><tspan fill="#1b2733" font-weight="bold">APLICATIVO</tspan><tspan fill="#4a5563">   React Native com Expo, consulta sob demanda</tspan></text><rect x="26.0" y="966" width="367.0" height="38" rx="6" fill="#ffffff" stroke="#4f4ab3" stroke-width="1.6"/><text x="209.5" y="991" font-size="15.5" text-anchor="middle" fill="#1b2733" style="white-space:pre">GET /diagnosticos</text><rect x="407.0" y="966" width="367.0" height="38" rx="6" fill="#ffffff" stroke="#4f4ab3" stroke-width="1.6"/><text x="590.5" y="991" font-size="15.5" text-anchor="middle" fill="#1b2733" style="white-space:pre">GET /leituras</text><rect x="26.0" y="1016" width="367.0" height="38" rx="6" fill="#ffffff" stroke="#4f4ab3" stroke-width="1.6"/><text x="209.5" y="1041" font-size="15.5" text-anchor="middle" fill="#1b2733" style="white-space:pre">GET /alertas</text><rect x="407.0" y="1016" width="367.0" height="38" rx="6" fill="#ffffff" stroke="#4f4ab3" stroke-width="1.6"/><text x="590.5" y="1041" font-size="15.5" text-anchor="middle" fill="#1b2733" style="white-space:pre">Filtro por posse do dispositivo</text><polyline points="234.0,856 234.0,965" fill="none" stroke="#1b2733" stroke-width="2" marker-end="url(#seta)"/></svg>