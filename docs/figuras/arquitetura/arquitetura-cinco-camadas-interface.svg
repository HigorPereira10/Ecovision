<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1030" width="800" height="1030" font-family="Arial, Helvetica, sans-serif"><defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/></marker><marker id="setai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2733"/></marker></defs><rect width="800" height="1030" fill="#ffffff"/><rect x="64" y="10" width="726" height="242" rx="10" fill="#fdf3e6" stroke="#a65f1c" stroke-width="1.8"/><text x="82" y="40" font-size="17" text-anchor="start" style="white-space:pre"><tspan fill="#1b2733" font-weight="bold">1 · BORDA</tspan><tspan fill="#4a5563">   aquisição no local</tspan></text><rect x="82.0" y="56" width="338.0" height="84" rx="7" fill="#ffffff" stroke="#a65f1c" stroke-width="1.5"/><text x="96.0" y="84.5" font-size="16.5" text-anchor="start" fill="#1b2733" font-weight="bold">Computador</text><text x="96.0" y="106.125" font-size="15" text-anchor="start" fill="#4a5563">Raspberry Pi 3 Model B+</text><text x="96.0" y="125.625" font-size="15" text-anchor="start" fill="#4a5563">Python 3, agendado por cron</text><rect x="434.0" y="56" width="338.0" height="84" rx="7" fill="#ffffff" stroke="#a65f1c" stroke-width="1.5"/><text x="448.0" y="84.5" font-size="16.5" text-anchor="start" fill="#1b2733" font-weight="bold">Imagem, a cada 2 h</text><text x="448.0" y="106.125" font-size="15" text-anchor="start" fill="#4a5563">Camera Module 3 e LED</text><text x="448.0" y="125.625" font-size="15" text-anchor="start" fill="#4a5563">JPEG em resolução nativa</text><rect x="82.0" y="152" width="338.0" height="84" rx="7" fill="#ffffff" stroke="#a65f1c" stroke-width="1.5"/><text x="96.0" y="180.5" font-size="16.5" text-anchor="start" fill="#1b2733" font-weight="bold">Sensores, a cada 15 min</text><text x="96.0" y="202.125" font-size="15" text-anchor="start" fill="#4a5563">DHT22: temperatura e umidade do ar</text><text x="96.0" y="221.625" font-size="15" text-anchor="start" fill="#4a5563">ADS1115 (I2C): umidade do solo</text><rect x="434.0" y="152" width="338.0" height="84" rx="7" fill="#ffffff" stroke="#a65f1c" stroke-width="1.5"/><text x="448.0" y="180.5" font-size="16.5" text-anchor="start" fill="#1b2733" font-weight="bold">Fila local</text><text x="448.0" y="202.125" font-size="15" text-anchor="start" fill="#4a5563">grava antes de enviar</text><text x="448.0" y="221.625" font-size="15" text-anchor="start" fill="#4a5563">tolera queda de rede</text><rect x="64" y="274" width="726" height="146" rx="10" fill="#eaf2fb" stroke="#2f6fb0" stroke-width="1.8"/><text x="82" y="304" font-size="17" text-anchor="start" style="white-space:pre"><tspan fill="#1b2733" font-weight="bold">2 · CONECTIVIDADE</tspan><tspan fill="#4a5563">   transporte até a nuvem</tspan></text><rect x="82.0" y="320" width="220.66666666666666" height="84" rx="7" fill="#ffffff" stroke="#2f6fb0" stroke-width="1.5"/><text x="96.0" y="348.5" font-size="16.5" text-anchor="start" fill="#1b2733" font-weight="bold">Rede</text><text x="96.0" y="370.125" font-size="15" text-anchor="start" fill="#4a5563">Wi-Fi local</text><text x="96.0" y="389.625" font-size="15" text-anchor="start" fill="#4a5563">HTTPS sobre TLS</text><rect x="316.66666666666663" y="320" width="220.66666666666666" height="84" rx="7" fill="#ffffff" stroke="#2f6fb0" stroke-width="1.5"/><text x="330.66666666666663" y="348.5" font-size="16.5" text-anchor="start" fill="#1b2733" font-weight="bold">Autenticação</text><text x="330.66666666666663" y="370.125" font-size="15" text-anchor="start" fill="#4a5563">credencial própria</text><text x="330.66666666666663" y="389.625" font-size="15" text-anchor="start" fill="#4a5563">de cada dispositivo</text><rect x="551.3333333333333" y="320" width="220.66666666666666" height="84" rx="7" fill="#ffffff" stroke="#2f6fb0" stroke-width="1.5"/><text x="565.3333333333333" y="348.5" font-size="16.5" text-anchor="start" fill="#1b2733" font-weight="bold">Idempotência</text><text x="565.3333333333333" y="370.125" font-size="15" text-anchor="start" fill="#4a5563">reenvio não duplica</text><text x="565.3333333333333" y="389.625" font-size="15" text-anchor="start" fill="#4a5563">o registro</text><rect x="64" y="442" width="726" height="242" rx="10" fill="#e5f3f2" stroke="#1d7373" stroke-width="1.8"/><text x="82" y="472" font-size="17" text-anchor="start" style="white-space:pre"><tspan fill="#1b2733" font-weight="bold">3 · INTELIGÊNCIA</tspan><tspan fill="#4a5563">   processamento na nuvem</tspan></text><rect x="82.0" y="488" width="338.0" height="84" rx="7" fill="#ffffff" stroke="#1d7373" stroke-width="1.5"/><text x="96.0" y="516.5" font-size="16.5" text-anchor="start" fill="#1b2733" font-weight="bold">Guarda de qualidade</text><text x="96.0" y="538.125" font-size="15" text-anchor="start" fill="#4a5563">brilho e textura da foto</text><text x="96.0" y="557.625" font-size="15" text-anchor="start" fill="#4a5563">foto inadequada não é analisada</text><rect x="434.0" y="488" width="338.0" height="84" rx="7" fill="#ffffff" stroke="#1d7373" stroke-width="1.5"/><text x="448.0" y="516.5" font-size="16.5" text-anchor="start" fill="#1b2733" font-weight="bold">Janela deslizante</text><text x="448.0" y="538.125" font-size="15" text-anchor="start" fill="#4a5563">recortes de 896 pixels</text><text x="448.0" y="557.625" font-size="15" text-anchor="start" fill="#4a5563">em vez do quadro inteiro</text><rect x="82.0" y="584" width="338.0" height="84" rx="7" fill="#ffffff" stroke="#1d7373" stroke-width="1.5"/><text x="96.0" y="612.5" font-size="16.5" text-anchor="start" fill="#1b2733" font-weight="bold">Classificador</text><text x="96.0" y="634.125" font-size="15" text-anchor="start" fill="#4a5563">MobileNetV2 em TensorFlow Lite</text><text x="96.0" y="653.625" font-size="15" text-anchor="start" fill="#4a5563">quatro classes</text><rect x="434.0" y="584" width="338.0" height="84" rx="7" fill="#ffffff" stroke="#1d7373" stroke-width="1.5"/><text x="448.0" y="612.5" font-size="16.5" text-anchor="start" fill="#1b2733" font-weight="bold">Regras ambientais</text><text x="448.0" y="634.125" font-size="15" text-anchor="start" fill="#4a5563">limiares de temperatura e de</text><text x="448.0" y="653.625" font-size="15" text-anchor="start" fill="#4a5563">umidade do ar e do solo</text><rect x="64" y="706" width="726" height="146" rx="10" fill="#f1f3f6" stroke="#5f6b7a" stroke-width="1.8"/><text x="82" y="736" font-size="17" text-anchor="start" style="white-space:pre"><tspan fill="#1b2733" font-weight="bold">4 · PERSISTÊNCIA</tspan><tspan fill="#4a5563">   Supabase gerenciado</tspan></text><rect x="82.0" y="752" width="220.66666666666666" height="84" rx="7" fill="#ffffff" stroke="#5f6b7a" stroke-width="1.5"/><text x="96.0" y="780.5" font-size="16.5" text-anchor="start" fill="#1b2733" font-weight="bold">PostgreSQL</text><text x="96.0" y="802.125" font-size="15" text-anchor="start" fill="#4a5563">8 tabelas</text><text x="96.0" y="821.625" font-size="15" text-anchor="start" fill="#4a5563">migrações versionadas</text><rect x="316.66666666666663" y="752" width="220.66666666666666" height="84" rx="7" fill="#ffffff" stroke="#5f6b7a" stroke-width="1.5"/><text x="330.66666666666663" y="780.5" font-size="16.5" text-anchor="start" fill="#1b2733" font-weight="bold">Armazenamento</text><text x="330.66666666666663" y="802.125" font-size="15" text-anchor="start" fill="#4a5563">imagens em</text><text x="330.66666666666663" y="821.625" font-size="15" text-anchor="start" fill="#4a5563">bucket privado</text><rect x="551.3333333333333" y="752" width="220.66666666666666" height="84" rx="7" fill="#ffffff" stroke="#5f6b7a" stroke-width="1.5"/><text x="565.3333333333333" y="780.5" font-size="16.5" text-anchor="start" fill="#1b2733" font-weight="bold">Escopo por dono</text><text x="565.3333333333333" y="802.125" font-size="15" text-anchor="start" fill="#4a5563">cada produtor vê só</text><text x="565.3333333333333" y="821.625" font-size="15" text-anchor="start" fill="#4a5563">os seus dispositivos</text><rect x="64" y="874" width="726" height="146" rx="10" fill="#ecebfb" stroke="#4f4ab3" stroke-width="1.8"/><text x="82" y="904" font-size="17" text-anchor="start" style="white-space:pre"><tspan fill="#1b2733" font-weight="bold">5 · INTERFACE COM O USUÁRIO</tspan><tspan fill="#4a5563">   consulta pelo produtor</tspan></text><rect x="82.0" y="920" width="220.66666666666666" height="84" rx="7" fill="#ffffff" stroke="#4f4ab3" stroke-width="1.5"/><text x="96.0" y="948.5" font-size="16.5" text-anchor="start" fill="#1b2733" font-weight="bold">Aplicativo Android</text><text x="96.0" y="970.125" font-size="15" text-anchor="start" fill="#4a5563">Expo e</text><text x="96.0" y="989.625" font-size="15" text-anchor="start" fill="#4a5563">React Native</text><rect x="316.66666666666663" y="920" width="220.66666666666666" height="84" rx="7" fill="#ffffff" stroke="#4f4ab3" stroke-width="1.5"/><text x="330.66666666666663" y="948.5" font-size="16.5" text-anchor="start" fill="#1b2733" font-weight="bold">Telas</text><text x="330.66666666666663" y="970.125" font-size="15" text-anchor="start" fill="#4a5563">leituras, diagnósticos</text><text x="330.66666666666663" y="989.625" font-size="15" text-anchor="start" fill="#4a5563">e alertas</text><rect x="551.3333333333333" y="920" width="220.66666666666666" height="84" rx="7" fill="#ffffff" stroke="#4f4ab3" stroke-width="1.5"/><text x="565.3333333333333" y="948.5" font-size="16.5" text-anchor="start" fill="#1b2733" font-weight="bold">Acesso</text><text x="565.3333333333333" y="970.125" font-size="15" text-anchor="start" fill="#4a5563">somente pela API,</text><text x="565.3333333333333" y="989.625" font-size="15" text-anchor="start" fill="#4a5563">nunca direto ao banco</text><polyline points="28,30 28,1000" fill="none" stroke="#4a5563" stroke-width="2.2" marker-end="url(#seta)"/><text x="18" y="515.0" font-size="15" fill="#4a5563" text-anchor="middle" transform="rotate(-90 18 515.0)">fluxo dos dados</text></svg>