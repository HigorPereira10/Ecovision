<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" font-family="'IBM Plex Sans','Segoe UI',sans-serif">
  <defs>
    <marker id="pt" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="6" markerHeight="6">
      <circle cx="3" cy="3" r="3" fill="#14213D"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1060" fill="#FFFFFF"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#14213D">Esquema elétrico do conjunto EcoVision</text>
  <text x="40" y="74" font-size="13.5" fill="#5B6B82">Como construído na placa definitiva. Os números entre colchetes são as redes do mapa de soldagem.</text>

  <!-- ============ TRILHOS ============ -->
  <line x1="300" y1="140" x2="1540" y2="140" stroke="#C0392B" stroke-width="3"/>
  <text x="300" y="130" font-size="13" font-weight="700" fill="#C0392B">+3,3 V   (pino 1)   [rede 1]</text>

  <line x1="300" y1="196" x2="1540" y2="196" stroke="#E67E22" stroke-width="3"/>
  <text x="300" y="188" font-size="13" font-weight="700" fill="#E67E22">+5 V   (pino 2)   [rede 2]</text>

  <line x1="300" y1="960" x2="1540" y2="960" stroke="#14213D" stroke-width="3"/>
  <text x="300" y="982" font-size="13" font-weight="700" fill="#14213D">GND   (pinos 6 e 9)   [rede 3]</text>

  <!-- ============ CONECTOR DO PI ============ -->
  <rect x="60" y="130" width="210" height="430" rx="8" fill="#FDF4EA" stroke="#A8631E" stroke-width="2"/>
  <rect x="60" y="130" width="210" height="34" rx="8" fill="#A8631E"/>
  <rect x="60" y="152" width="210" height="12" fill="#A8631E"/>
  <text x="165" y="153" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Raspberry Pi 3B+</text>
  <text x="165" y="182" font-size="11.5" fill="#5B6B82" text-anchor="middle">conector 2x10, pinos 1 a 20</text>

  <text x="80" y="214" font-size="12.5" fill="#14213D">pino 1</text><text x="200" y="214" font-size="12.5" font-weight="600" fill="#C0392B">3,3 V</text>
  <text x="80" y="244" font-size="12.5" fill="#14213D">pino 2</text><text x="200" y="244" font-size="12.5" font-weight="600" fill="#E67E22">5 V</text>
  <text x="80" y="274" font-size="12.5" fill="#14213D">pino 3</text><text x="178" y="274" font-size="12.5" font-weight="600" fill="#0E7C86">GPIO2 SDA</text>
  <text x="80" y="304" font-size="12.5" fill="#14213D">pino 5</text><text x="178" y="304" font-size="12.5" font-weight="600" fill="#0E7C86">GPIO3 SCL</text>
  <text x="80" y="334" font-size="12.5" fill="#14213D">pino 6</text><text x="208" y="334" font-size="12.5" font-weight="600" fill="#14213D">GND</text>
  <text x="80" y="364" font-size="12.5" fill="#14213D">pino 7</text><text x="192" y="364" font-size="12.5" font-weight="600" fill="#6250D6">GPIO4</text>
  <text x="80" y="394" font-size="12.5" fill="#14213D">pino 9</text><text x="208" y="394" font-size="12.5" font-weight="600" fill="#14213D">GND</text>
  <text x="80" y="424" font-size="12.5" fill="#14213D">pino 12</text><text x="186" y="424" font-size="12.5" font-weight="600" fill="#B4453F">GPIO18</text>
  <line x1="76" y1="440" x2="254" y2="440" stroke="#D8CCBC"/>
  <text x="80" y="462" font-size="11" fill="#5B6B82">Demais pinos do conector</text>
  <text x="80" y="478" font-size="11" fill="#5B6B82">não são usados: servem</text>
  <text x="80" y="494" font-size="11" fill="#5B6B82">apenas de fixação mecânica.</text>
  <text x="80" y="524" font-size="11" fill="#5B6B82">Alimentação: fonte externa</text>
  <text x="80" y="540" font-size="11" fill="#5B6B82">5 V / 3 A por micro-USB.</text>

  <!-- ligacoes do conector aos trilhos e sinais -->
  <path d="M 270 212 L 286 212 L 286 140" fill="none" stroke="#C0392B" stroke-width="2"/>
  <path d="M 270 242 L 294 242 L 294 196" fill="none" stroke="#E67E22" stroke-width="2"/>
  <path d="M 270 332 L 286 332 L 286 960" fill="none" stroke="#14213D" stroke-width="2"/>
  <path d="M 270 392 L 286 392" fill="none" stroke="#14213D" stroke-width="2"/>

  <!-- SDA / SCL -->
  <path d="M 270 272 L 400 272" fill="none" stroke="#0E7C86" stroke-width="2"/>
  <text x="300" y="266" font-size="11" fill="#0E7C86">SDA [4]</text>
  <path d="M 270 302 L 400 302" fill="none" stroke="#0E7C86" stroke-width="2"/>
  <text x="300" y="318" font-size="11" fill="#0E7C86">SCL [5]</text>

  <!-- GPIO4 -->
  <path d="M 270 362 L 332 362 L 332 514 L 690 514" fill="none" stroke="#6250D6" stroke-width="2"/>
  <text x="400" y="508" font-size="11" fill="#6250D6">dados do DHT22 [6]</text>

  <!-- GPIO18 -->
  <path d="M 270 422 L 1120 422 L 1120 640" fill="none" stroke="#B4453F" stroke-width="2"/>
  <text x="968" y="412" font-size="11" fill="#B4453F">comando do LED [7]</text>

  <!-- ============ ADS1115 ============ -->
  <rect x="400" y="228" width="236" height="188" rx="8" fill="#E8F3F4" stroke="#0E7C86" stroke-width="2"/>
  <text x="518" y="254" font-size="13.5" font-weight="700" fill="#14213D" text-anchor="middle">ADS1115</text>
  <text x="518" y="272" font-size="11" fill="#5B6B82" text-anchor="middle">conversor A/D de 16 bits</text>
  <text x="416" y="298" font-size="11.5" fill="#14213D">VDD</text>
  <text x="416" y="320" font-size="11.5" fill="#14213D">GND</text>
  <text x="416" y="342" font-size="11.5" fill="#14213D">SCL / SDA</text>
  <text x="416" y="364" font-size="11.5" fill="#14213D">ADDR</text>
  <text x="416" y="386" font-size="11.5" fill="#14213D">A0 e A1</text>
  <text x="520" y="364" font-size="11" font-style="italic" fill="#B4453F">ligado ao GND</text>
  <text x="520" y="386" font-size="11" font-style="italic" fill="#5B6B82">unidos [11]</text>
  <text x="416" y="408" font-size="10.5" fill="#5B6B82">endereço I2C resultante: 0x48</text>

  <path d="M 470 228 L 470 140" fill="none" stroke="#C0392B" stroke-width="2"/>
  <path d="M 440 416 L 440 960" fill="none" stroke="#14213D" stroke-width="2"/>
  <path d="M 400 272 L 400 302" fill="none" stroke="#0E7C86" stroke-width="2"/>

  <!-- ============ SENSOR DE SOLO ============ -->
  <rect x="400" y="676" width="236" height="150" rx="8" fill="#F5F6F9" stroke="#8A94A6" stroke-width="2"/>
  <text x="518" y="702" font-size="13.5" font-weight="700" fill="#14213D" text-anchor="middle">Sensor de solo</text>
  <text x="518" y="720" font-size="11" fill="#5B6B82" text-anchor="middle">capacitivo v1.2</text>
  <text x="416" y="748" font-size="11.5" fill="#14213D">VCC</text>
  <text x="416" y="770" font-size="11.5" fill="#14213D">AOUT</text>
  <text x="416" y="792" font-size="11.5" fill="#14213D">GND</text>
  <text x="416" y="816" font-size="10.5" fill="#5B6B82">alimentado em 3,3 V, não 5 V</text>

  <path d="M 606 676 L 606 140" fill="none" stroke="#C0392B" stroke-width="2"/>
  <path d="M 520 826 L 520 960" fill="none" stroke="#14213D" stroke-width="2"/>
  <path d="M 400 766 L 360 766 L 360 392 L 400 392" fill="none" stroke="#8A94A6" stroke-width="2"/>
  <text x="300" y="600" font-size="11" fill="#5B6B82">sinal analógico [11]</text>

  <!-- ============ DHT22 ============ -->
  <rect x="690" y="420" width="236" height="150" rx="8" fill="#ECEDFA" stroke="#6250D6" stroke-width="2"/>
  <text x="808" y="446" font-size="13.5" font-weight="700" fill="#14213D" text-anchor="middle">DHT22</text>
  <text x="808" y="464" font-size="11" fill="#5B6B82" text-anchor="middle">temperatura e umidade do ar</text>
  <text x="706" y="492" font-size="11.5" fill="#14213D">VCC</text>
  <text x="706" y="514" font-size="11.5" fill="#14213D">DATA</text>
  <text x="706" y="536" font-size="11.5" fill="#14213D">GND</text>
  <text x="706" y="560" font-size="10.5" fill="#5B6B82">protocolo de fio único</text>

  <path d="M 896 420 L 896 140" fill="none" stroke="#C0392B" stroke-width="2"/>
  <path d="M 820 570 L 820 960" fill="none" stroke="#14213D" stroke-width="2"/>

  <!-- R3: pull-up do DHT22 -->
  <line x1="960" y1="300" x2="960" y2="140" stroke="#C0392B" stroke-width="2"/>
  <rect x="938" y="300" width="44" height="78" rx="4" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
  <text x="996" y="330" font-size="12" font-weight="700" fill="#14213D">R3</text>
  <text x="996" y="348" font-size="11.5" fill="#14213D">10 kΩ</text>
  <text x="996" y="366" font-size="10.5" font-style="italic" fill="#5B6B82">pull-up</text>
  <path d="M 960 378 L 960 598 L 652 598 L 652 514" fill="none" stroke="#6250D6" stroke-width="2"/>
  <circle cx="652" cy="514" r="4.5" fill="#14213D"/>

  <!-- ============ CIRCUITO DO LED ============ -->
  <rect x="1180" y="236" width="300" height="130" rx="8" fill="#FFF8E6" stroke="#B8860B" stroke-width="2"/>
  <text x="1330" y="262" font-size="13.5" font-weight="700" fill="#14213D" text-anchor="middle">LED de potência</text>
  <text x="1330" y="280" font-size="11" fill="#5B6B82" text-anchor="middle">branco, dissipador estrela 3 W</text>
  <text x="1196" y="306" font-size="11.5" fill="#14213D">ânodo (+)</text>
  <text x="1196" y="328" font-size="11.5" fill="#14213D">cátodo (−)</text>
  <text x="1196" y="352" font-size="10.5" fill="#5B6B82">Vf ≈ 3,2 V, operando a 265 mA</text>

  <path d="M 1300 236 L 1300 196" fill="none" stroke="#E67E22" stroke-width="2"/>

  <!-- R1 -->
  <line x1="1330" y1="366" x2="1330" y2="430" stroke="#14213D" stroke-width="2"/>
  <rect x="1308" y="430" width="44" height="86" rx="4" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
  <text x="1366" y="462" font-size="12" font-weight="700" fill="#14213D">R1</text>
  <text x="1366" y="480" font-size="11.5" fill="#14213D">6,8 Ω / 2 W</text>
  <text x="1366" y="498" font-size="10.5" font-style="italic" fill="#5B6B82">limita a corrente</text>
  <text x="1366" y="514" font-size="10.5" font-style="italic" fill="#5B6B82">dissipa 0,48 W</text>
  <line x1="1330" y1="516" x2="1330" y2="640" stroke="#14213D" stroke-width="2"/>
  <text x="1346" y="560" font-size="11" fill="#5B6B82">[redes 9 e 10]</text>

  <!-- R2: resistor de porta -->
  <line x1="1120" y1="640" x2="1180" y2="640" stroke="#B4453F" stroke-width="2"/>
  <rect x="1180" y="618" width="80" height="44" rx="4" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
  <text x="1220" y="606" font-size="12" font-weight="700" fill="#14213D" text-anchor="middle">R2  10 kΩ</text>
  <text x="1220" y="678" font-size="10.5" font-style="italic" fill="#5B6B82" text-anchor="middle">em série com a porta [8]</text>
  <line x1="1260" y1="640" x2="1292" y2="640" stroke="#14213D" stroke-width="2"/>

  <!-- MOSFET -->
  <line x1="1292" y1="596" x2="1292" y2="684" stroke="#14213D" stroke-width="3"/>
  <line x1="1302" y1="602" x2="1302" y2="626" stroke="#14213D" stroke-width="4"/>
  <line x1="1302" y1="628" x2="1302" y2="652" stroke="#14213D" stroke-width="4"/>
  <line x1="1302" y1="654" x2="1302" y2="678" stroke="#14213D" stroke-width="4"/>
  <line x1="1302" y1="614" x2="1330" y2="614" stroke="#14213D" stroke-width="2"/>
  <line x1="1302" y1="666" x2="1330" y2="666" stroke="#14213D" stroke-width="2"/>
  <line x1="1330" y1="614" x2="1330" y2="640" stroke="#14213D" stroke-width="2"/>
  <line x1="1330" y1="666" x2="1330" y2="960" stroke="#14213D" stroke-width="2"/>
  <text x="1346" y="618" font-size="11.5" font-weight="600" fill="#14213D">D</text>
  <text x="1270" y="644" font-size="11.5" font-weight="600" fill="#14213D">G</text>
  <text x="1346" y="670" font-size="11.5" font-weight="600" fill="#14213D">S</text>
  <text x="1232" y="712" font-size="12.5" font-weight="700" fill="#14213D">MOSFET IRLZ44N</text>
  <text x="1232" y="730" font-size="11" fill="#5B6B82">canal N, nível lógico</text>
  <text x="1232" y="746" font-size="11" fill="#5B6B82">chaveamento lado-baixo</text>

  <!-- ALERTA: ausencia de pull-down -->
  <rect x="1060" y="788" width="480" height="140" rx="8" fill="#E8F3F4" stroke="#0E7C86" stroke-width="2"/>
  <text x="1080" y="814" font-size="12.5" font-weight="700" fill="#0E7C86">Por que não há resistor de pull-down na porta</text>
  <text x="1080" y="838" font-size="11.5" fill="#14213D">O R2 está em série entre o GPIO18 e a porta: ele limita a corrente</text>
  <text x="1080" y="856" font-size="11.5" fill="#14213D">de carga, não define o nível. Quem define é o próprio SoC: no</text>
  <text x="1080" y="874" font-size="11.5" fill="#14213D">BCM2835 os GPIOs de 9 em diante nascem com pull-down interno</text>
  <text x="1080" y="892" font-size="11.5" fill="#14213D">ativo, e o GPIO18 está nessa faixa.</text>
  <text x="1080" y="916" font-size="11.5" font-style="italic" fill="#5B6B82">A porta já fica em nível baixo desde a energização.</text>

  <!-- nota de desacoplamento -->
  <rect x="60" y="616" width="286" height="104" rx="8" fill="#F5F6F9" stroke="#8A94A6"/>
  <text x="78" y="640" font-size="12" font-weight="700" fill="#14213D">Desacoplamento</text>
  <text x="78" y="662" font-size="11" fill="#5B6B82">Não há capacitores discretos na</text>
  <text x="78" y="678" font-size="11" fill="#5B6B82">placa. O módulo ADS1115 já traz</text>
  <text x="78" y="694" font-size="11" fill="#5B6B82">o seu próprio, de fábrica, e os</text>
  <text x="78" y="710" font-size="11" fill="#5B6B82">demais consumos são baixos.</text>
</svg>
