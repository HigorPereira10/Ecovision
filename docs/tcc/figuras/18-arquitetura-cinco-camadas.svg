<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" font-family="'IBM Plex Sans','Segoe UI',sans-serif">
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#5B6B82"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1020" fill="#EEF1F5"/>
  <text x="40" y="48" font-size="25" font-weight="700" fill="#14213D">Arquitetura do ecossistema prototipado</text>
  <text x="40" y="76" font-size="14" fill="#5B6B82">As cinco camadas do conjunto EcoVision. A seta à direita indica o sentido do fluxo de dados, da captura à consulta.</text>

  <!-- seta de fluxo -->
  <path d="M 1548 120 L 1548 940" fill="none" stroke="#5B6B82" stroke-width="2.5" marker-end="url(#fl)"/>
  <text x="1538" y="520" font-size="12" fill="#5B6B82" transform="rotate(90 1538 520)" text-anchor="middle">fluxo dos dados</text>

  <!-- ============ 1. BORDA ============ -->
  <rect x="40" y="108" width="1460" height="170" rx="12" fill="#FFFFFF" stroke="#A7B4C6"/>
  <rect x="40" y="108" width="1460" height="36" rx="12" fill="#A8631E"/>
  <rect x="40" y="130" width="1460" height="14" fill="#A8631E"/>
  <text x="62" y="133" font-size="14.5" font-weight="700" fill="#FFFFFF">1 · CAMADA DE BORDA</text>
  <text x="300" y="133" font-size="12.5" fill="#F6E3CE">aquisição no local, autônoma, a cada 2 horas</text>

  <rect x="66" y="162" width="266" height="98" rx="9" fill="#FDF4EA" stroke="#A8631E"/>
  <text x="199" y="188" font-size="13.5" font-weight="700" fill="#14213D" text-anchor="middle">Computador</text>
  <text x="199" y="210" font-size="12" fill="#5B6B82" text-anchor="middle">Raspberry Pi 3 Model B+</text>
  <text x="199" y="228" font-size="12" fill="#5B6B82" text-anchor="middle">Raspberry Pi OS Lite 64 bits</text>
  <text x="199" y="248" font-size="12" fill="#5B6B82" text-anchor="middle">Python 3, disparo por cron</text>

  <rect x="348" y="162" width="266" height="98" rx="9" fill="#FDF4EA" stroke="#A8631E"/>
  <text x="481" y="188" font-size="13.5" font-weight="700" fill="#14213D" text-anchor="middle">Aquisição de imagem</text>
  <text x="481" y="210" font-size="12" fill="#5B6B82" text-anchor="middle">Camera Module 3 (IMX708)</text>
  <text x="481" y="228" font-size="12" fill="#5B6B82" text-anchor="middle">LED 3 W com chave MOSFET</text>
  <text x="481" y="248" font-size="12" fill="#5B6B82" text-anchor="middle">compressão JPEG local</text>

  <rect x="630" y="162" width="266" height="98" rx="9" fill="#FDF4EA" stroke="#A8631E"/>
  <text x="763" y="188" font-size="13.5" font-weight="700" fill="#14213D" text-anchor="middle">Aquisição ambiental</text>
  <text x="763" y="210" font-size="12" fill="#5B6B82" text-anchor="middle">DHT22: ar, temperatura e umidade</text>
  <text x="763" y="228" font-size="12" fill="#5B6B82" text-anchor="middle">sensor capacitivo: solo</text>
  <text x="763" y="248" font-size="12" fill="#5B6B82" text-anchor="middle">ADS1115 por barramento I2C</text>

  <rect x="912" y="162" width="266" height="98" rx="9" fill="#A8631E"/>
  <text x="1045" y="188" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Fila local</text>
  <text x="1045" y="210" font-size="12" fill="#F6E3CE" text-anchor="middle">grava em disco antes de enviar</text>
  <text x="1045" y="228" font-size="12" fill="#F6E3CE" text-anchor="middle">drena a cada 15 minutos</text>
  <text x="1045" y="248" font-size="12" fill="#F6E3CE" text-anchor="middle">tolera queda de rede</text>

  <rect x="1194" y="162" width="280" height="98" rx="9" fill="#F7F3EE" stroke="#A8631E" stroke-dasharray="5 4"/>
  <text x="1334" y="188" font-size="13.5" font-weight="700" fill="#14213D" text-anchor="middle">Alimentação</text>
  <text x="1334" y="210" font-size="12" fill="#5B6B82" text-anchor="middle">fonte 5 V / 3 A, micro-USB</text>
  <text x="1334" y="228" font-size="12" fill="#5B6B82" text-anchor="middle">pico medido: 265 mA no LED</text>
  <text x="1334" y="248" font-size="12" fill="#5B6B82" text-anchor="middle">sem evento de subtensão</text>

  <!-- ============ 2. CONECTIVIDADE ============ -->
  <rect x="40" y="298" width="1460" height="124" rx="12" fill="#FFFFFF" stroke="#A7B4C6"/>
  <rect x="40" y="298" width="1460" height="36" rx="12" fill="#5B6B82"/>
  <rect x="40" y="320" width="1460" height="14" fill="#5B6B82"/>
  <text x="62" y="323" font-size="14.5" font-weight="700" fill="#FFFFFF">2 · CAMADA DE CONECTIVIDADE</text>
  <text x="372" y="323" font-size="12.5" fill="#DCE2E9">transporte entre a borda e a nuvem</text>

  <rect x="66" y="352" width="340" height="52" rx="9" fill="#F0F3F6" stroke="#8A94A6"/>
  <text x="236" y="374" font-size="13" font-weight="700" fill="#14213D" text-anchor="middle">Wi-Fi 802.11 (2,4 e 5 GHz)</text>
  <text x="236" y="393" font-size="11.5" fill="#5B6B82" text-anchor="middle">rede local da propriedade</text>

  <rect x="422" y="352" width="400" height="52" rx="9" fill="#F0F3F6" stroke="#8A94A6"/>
  <text x="622" y="374" font-size="13" font-weight="700" fill="#14213D" text-anchor="middle">HTTPS sobre TLS, porta 443</text>
  <text x="622" y="393" font-size="11.5" fill="#5B6B82" text-anchor="middle">POST multipart com imagem e leituras</text>

  <rect x="838" y="352" width="310" height="52" rx="9" fill="#F0F3F6" stroke="#8A94A6"/>
  <text x="993" y="374" font-size="13" font-weight="700" fill="#14213D" text-anchor="middle">Credencial por dispositivo</text>
  <text x="993" y="393" font-size="11.5" fill="#5B6B82" text-anchor="middle">segredo próprio, verificado por bcrypt</text>

  <rect x="1164" y="352" width="310" height="52" rx="9" fill="#F0F3F6" stroke="#8A94A6"/>
  <text x="1319" y="374" font-size="13" font-weight="700" fill="#14213D" text-anchor="middle">Chave de idempotência</text>
  <text x="1319" y="393" font-size="11.5" fill="#5B6B82" text-anchor="middle">reenvio não duplica registro</text>

  <text x="770" y="440" font-size="11.5" font-style="italic" fill="#5B6B82" text-anchor="middle">Não se utiliza MQTT: o volume é de uma captura a cada duas horas, e o REST sobre HTTPS dispensa manter um intermediário de mensagens.</text>

  <!-- ============ 3. INTELIGENCIA ============ -->
  <rect x="40" y="462" width="1460" height="158" rx="12" fill="#FFFFFF" stroke="#A7B4C6"/>
  <rect x="40" y="462" width="1460" height="36" rx="12" fill="#0E7C86"/>
  <rect x="40" y="484" width="1460" height="14" fill="#0E7C86"/>
  <text x="62" y="487" font-size="14.5" font-weight="700" fill="#FFFFFF">3 · CAMADA DE INTELIGÊNCIA</text>
  <text x="372" y="487" font-size="12.5" fill="#CFE7E9">decide antes de persistir</text>

  <rect x="66" y="516" width="330" height="86" rx="9" fill="#0E7C86"/>
  <text x="231" y="542" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Guarda de qualidade</text>
  <text x="231" y="562" font-size="12" fill="#CFE7E9" text-anchor="middle">brilho e textura, antes de classificar</text>
  <text x="231" y="580" font-size="12" fill="#CFE7E9" text-anchor="middle">foto ruim não vira diagnóstico</text>
  <text x="231" y="596" font-size="11.5" fill="#CFE7E9" text-anchor="middle">custo medido: 8,8 ms</text>

  <rect x="412" y="516" width="400" height="86" rx="9" fill="#E8F3F4" stroke="#0E7C86"/>
  <text x="612" y="542" font-size="13.5" font-weight="700" fill="#14213D" text-anchor="middle">Classificador de doenças</text>
  <text x="612" y="562" font-size="12" fill="#5B6B82" text-anchor="middle">MobileNetV2 em TensorFlow Lite, 8,47 MB</text>
  <text x="612" y="580" font-size="12" fill="#5B6B82" text-anchor="middle">3 classes: septoriose, pinta-preta, saudável</text>
  <text x="612" y="596" font-size="11.5" fill="#5B6B82" text-anchor="middle">94,3% em laboratório e 74,1% em campo</text>

  <rect x="828" y="516" width="330" height="86" rx="9" fill="#E8F3F4" stroke="#0E7C86"/>
  <text x="993" y="542" font-size="13.5" font-weight="700" fill="#14213D" text-anchor="middle">Regras ambientais</text>
  <text x="993" y="562" font-size="12" fill="#5B6B82" text-anchor="middle">limiares de temperatura e umidade</text>
  <text x="993" y="580" font-size="12" fill="#5B6B82" text-anchor="middle">avaliadas a partir das leituras,</text>
  <text x="993" y="596" font-size="12" fill="#5B6B82" text-anchor="middle">de forma independente da imagem</text>

  <rect x="1174" y="516" width="300" height="86" rx="9" fill="#E8F3F4" stroke="#0E7C86"/>
  <text x="1324" y="542" font-size="13.5" font-weight="700" fill="#14213D" text-anchor="middle">Geração de alertas</text>
  <text x="1324" y="562" font-size="12" fill="#5B6B82" text-anchor="middle">severidade alta, média ou baixa</text>
  <text x="1324" y="580" font-size="12" fill="#5B6B82" text-anchor="middle">de doença apenas quando há</text>
  <text x="1324" y="596" font-size="12" fill="#5B6B82" text-anchor="middle">doença classificada</text>

  <!-- ============ 4. PERSISTENCIA ============ -->
  <rect x="40" y="640" width="1460" height="140" rx="12" fill="#FFFFFF" stroke="#A7B4C6"/>
  <rect x="40" y="640" width="1460" height="36" rx="12" fill="#1C5CAB"/>
  <rect x="40" y="662" width="1460" height="14" fill="#1C5CAB"/>
  <text x="62" y="665" font-size="14.5" font-weight="700" fill="#FFFFFF">4 · CAMADA DE PERSISTÊNCIA</text>
  <text x="372" y="665" font-size="12.5" fill="#CDE2FB">Supabase, plataforma gerenciada</text>

  <rect x="66" y="694" width="440" height="68" rx="9" fill="#EAF2FC" stroke="#1C5CAB"/>
  <text x="286" y="720" font-size="13.5" font-weight="700" fill="#14213D" text-anchor="middle">Banco relacional PostgreSQL</text>
  <text x="286" y="740" font-size="12" fill="#5B6B82" text-anchor="middle">8 tabelas, identificadores inteiros</text>
  <text x="286" y="756" font-size="12" fill="#5B6B82" text-anchor="middle">migrações versionadas por Alembic</text>

  <rect x="522" y="694" width="440" height="68" rx="9" fill="#EAF2FC" stroke="#1C5CAB"/>
  <text x="742" y="720" font-size="13.5" font-weight="700" fill="#14213D" text-anchor="middle">Armazenamento de objetos</text>
  <text x="742" y="740" font-size="12" fill="#5B6B82" text-anchor="middle">bucket privado para as imagens</text>
  <text x="742" y="756" font-size="12" fill="#5B6B82" text-anchor="middle">acesso por URL assinada de 1 hora</text>

  <rect x="978" y="694" width="496" height="68" rx="9" fill="#EAF2FC" stroke="#1C5CAB"/>
  <text x="1226" y="720" font-size="13.5" font-weight="700" fill="#14213D" text-anchor="middle">Serviço de aplicação</text>
  <text x="1226" y="740" font-size="12" fill="#5B6B82" text-anchor="middle">FastAPI em Python, hospedado no Railway</text>
  <text x="1226" y="756" font-size="12" fill="#5B6B82" text-anchor="middle">16 endpoints, 128 testes automatizados</text>

  <!-- ============ 5. INTERFACE ============ -->
  <rect x="40" y="800" width="1460" height="140" rx="12" fill="#FFFFFF" stroke="#A7B4C6"/>
  <rect x="40" y="800" width="1460" height="36" rx="12" fill="#4C51BF"/>
  <rect x="40" y="822" width="1460" height="14" fill="#4C51BF"/>
  <text x="62" y="825" font-size="14.5" font-weight="700" fill="#FFFFFF">5 · CAMADA DE INTERFACE COM O USUÁRIO</text>
  <text x="520" y="825" font-size="12.5" fill="#D6D8F6">consulta sob demanda, pelo produtor</text>

  <rect x="66" y="854" width="440" height="68" rx="9" fill="#ECEDFA" stroke="#4C51BF"/>
  <text x="286" y="880" font-size="13.5" font-weight="700" fill="#14213D" text-anchor="middle">Aplicativo móvel</text>
  <text x="286" y="900" font-size="12" fill="#5B6B82" text-anchor="middle">React Native com Expo, Android</text>
  <text x="286" y="916" font-size="12" fill="#5B6B82" text-anchor="middle">distribuição por canal de atualização</text>

  <rect x="522" y="854" width="440" height="68" rx="9" fill="#ECEDFA" stroke="#4C51BF"/>
  <text x="742" y="880" font-size="13.5" font-weight="700" fill="#14213D" text-anchor="middle">Telas de consulta</text>
  <text x="742" y="900" font-size="12" fill="#5B6B82" text-anchor="middle">situação sanitária, diagnóstico, histórico,</text>
  <text x="742" y="916" font-size="12" fill="#5B6B82" text-anchor="middle">alertas, perfil e controle de gastos</text>

  <rect x="978" y="854" width="496" height="68" rx="9" fill="#4C51BF"/>
  <text x="1226" y="880" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Controle de acesso por posse</text>
  <text x="1226" y="900" font-size="12" fill="#D6D8F6" text-anchor="middle">autenticação por token, e cada produtor</text>
  <text x="1226" y="916" font-size="12" fill="#D6D8F6" text-anchor="middle">enxerga apenas os seus dispositivos</text>

  <text x="40" y="978" font-size="11.5" font-style="italic" fill="#5B6B82">Observação sobre a ordem: a camada de Inteligência aparece antes da de Persistência porque é essa a sequência real de execução. A imagem é</text>
  <text x="40" y="996" font-size="11.5" font-style="italic" fill="#5B6B82">avaliada e classificada antes de ser gravada, e não depois, de modo que uma captura inadequada nunca produz um diagnóstico afirmado.</text>
</svg>
