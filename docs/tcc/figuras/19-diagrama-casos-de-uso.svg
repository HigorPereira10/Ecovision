  </g>
  <text x="1432" y="622" font-size="15" font-weight="700" fill="#14213D" text-anchor="middle">Produtor Rural</text>
  <text x="1432" y="642" font-size="12" fill="#5B6B82" text-anchor="middle">usuário primário</text>

