<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" font-family="'IBM Plex Sans','Segoe UI',sans-serif">
  <defs>
    <marker id="inc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#5B6B82" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1120" fill="#FFFFFF"/>

  <!-- fronteira do sistema -->
  <rect x="372" y="96" width="856" height="940" rx="22" fill="#FAFBFC" stroke="#14213D" stroke-width="2"/>
  <text x="800" y="132" font-size="17" font-weight="700" fill="#14213D" text-anchor="middle">Sistema EcoVision</text>

  <!-- ================= ATOR: DISPOSITIVO ================= -->
  <g stroke="#A8631E" stroke-width="2.4" fill="none">
    <circle cx="168" cy="252" r="26"/>
    <line x1="168" y1="278" x2="168" y2="356"/>
    <line x1="120" y1="304" x2="216" y2="304"/>
    <line x1="168" y1="356" x2="130" y2="416"/>
    <line x1="168" y1="356" x2="206" y2="416"/>
  </g>
  <text x="168" y="444" font-size="15" font-weight="700" fill="#14213D" text-anchor="middle">Dispositivo IoT</text>
  <text x="168" y="464" font-size="12" fill="#5B6B82" text-anchor="middle">ciclo automatizado</text>

  <!-- ================= ATOR: PRODUTOR ================= -->
  <g stroke="#4C51BF" stroke-width="2.4" fill="none">
    <circle cx="1432" cy="430" r="26"/>
    <line x1="1432" y1="456" x2="1432" y2="534"/>
    <line x1="1384" y1="482" x2="1480" y2="482"/>
    <line x1="1432" y1="534" x2="1394" y2="594"/>
