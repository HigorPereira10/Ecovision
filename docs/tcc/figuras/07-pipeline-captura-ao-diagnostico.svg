<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="'IBM Plex Sans','Segoe UI',sans-serif">
  <defs>
    <marker id="setaEdge" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#A8631E"/>
    </marker>
    <marker id="setaCloud" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#0E7C86"/>
    </marker>
    <marker id="setaApp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#4C51BF"/>
    </marker>
    <marker id="setaAlerta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#B4453F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1000" fill="#EEF1F5"/>

  <text x="40" y="52" font-size="25" font-weight="700" fill="#14213D">Da captura ao diagnóstico</text>
  <text x="40" y="80" font-size="14" fill="#5B6B82">Fluxo real implementado. A guarda de qualidade decide ANTES de classificar, e a foto é guardada nos dois caminhos.</text>

  <!-- ============ CAMADA 1: DISPOSITIVO ============ -->
  <rect x="40" y="110" width="1520" height="168" rx="12" fill="#FFFFFF" stroke="#A7B4C6"/>
  <rect x="40" y="110" width="1520" height="34" rx="12" fill="#A8631E"/>
  <rect x="40" y="132" width="1520" height="12" fill="#A8631E"/>
  <text x="60" y="133" font-size="14" font-weight="600" fill="#FFFFFF">DISPOSITIVO · Raspberry Pi 3 Model B+ · a cada 2 horas</text>

  <rect x="68" y="168" width="250" height="84" rx="10" fill="#FDF4EA" stroke="#A8631E"/>
  <text x="193" y="198" font-size="15" font-weight="600" fill="#14213D" text-anchor="middle">1. Aciona o LED</text>
  <text x="193" y="219" font-size="12" fill="#5B6B82" text-anchor="middle">MOSFET no GPIO18</text>
  <text x="193" y="237" font-size="12" fill="#5B6B82" text-anchor="middle">36,5 lux medidos</text>

  <line x1="326" y1="210" x2="368" y2="210" stroke="#A8631E" stroke-width="2" marker-end="url(#setaEdge)"/>

  <rect x="376" y="168" width="250" height="84" rx="10" fill="#FDF4EA" stroke="#A8631E"/>
  <text x="501" y="198" font-size="15" font-weight="600" fill="#14213D" text-anchor="middle">2. Captura a foto</text>
  <text x="501" y="219" font-size="12" fill="#5B6B82" text-anchor="middle">Camera Module 3</text>
  <text x="501" y="237" font-size="12" fill="#5B6B82" text-anchor="middle">ciclo de 8 s</text>

  <line x1="634" y1="210" x2="676" y2="210" stroke="#A8631E" stroke-width="2" marker-end="url(#setaEdge)"/>

  <rect x="684" y="168" width="250" height="84" rx="10" fill="#FDF4EA" stroke="#A8631E"/>
  <text x="809" y="198" font-size="15" font-weight="600" fill="#14213D" text-anchor="middle">3. Lê os sensores</text>
  <text x="809" y="219" font-size="12" fill="#5B6B82" text-anchor="middle">DHT22 · ADS1115</text>
  <text x="809" y="237" font-size="12" fill="#5B6B82" text-anchor="middle">falha de sensor não aborta</text>

  <line x1="942" y1="210" x2="984" y2="210" stroke="#A8631E" stroke-width="2" marker-end="url(#setaEdge)"/>

  <rect x="992" y="168" width="250" height="84" rx="10" fill="#FDF4EA" stroke="#A8631E"/>
  <text x="1117" y="198" font-size="15" font-weight="600" fill="#14213D" text-anchor="middle">4. Comprime o JPEG</text>
  <text x="1117" y="219" font-size="12" fill="#5B6B82" text-anchor="middle">qualidade 70</text>
  <text x="1117" y="237" font-size="12" fill="#5B6B82" text-anchor="middle">204 KB a 718 KB</text>

  <line x1="1250" y1="210" x2="1292" y2="210" stroke="#A8631E" stroke-width="2" marker-end="url(#setaEdge)"/>

  <rect x="1300" y="168" width="232" height="84" rx="10" fill="#A8631E"/>
  <text x="1416" y="198" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">5. Fila offline</text>
  <text x="1416" y="219" font-size="12" fill="#F6E3CE" text-anchor="middle">grava em disco local</text>
  <text x="1416" y="237" font-size="12" fill="#F6E3CE" text-anchor="middle">drena a cada 15 min</text>

  <!-- seta descendo para a nuvem -->
  <path d="M 1416 258 L 1416 300 L 150 300 L 150 336" fill="none" stroke="#A8631E" stroke-width="2.5" marker-end="url(#setaEdge)"/>
  <rect x="556" y="284" width="470" height="32" rx="8" fill="#EEF1F5"/>
  <text x="791" y="306" font-size="13" font-weight="600" fill="#14213D" text-anchor="middle">POST /diagnostico · multipart · Authorization: chave do dispositivo</text>

  <!-- ============ CAMADA 2: NUVEM ============ -->
  <rect x="40" y="336" width="1520" height="420" rx="12" fill="#FFFFFF" stroke="#A7B4C6"/>
  <rect x="40" y="336" width="1520" height="34" rx="12" fill="#0E7C86"/>
  <rect x="40" y="358" width="1520" height="12" fill="#0E7C86"/>
  <text x="60" y="359" font-size="14" font-weight="600" fill="#FFFFFF">NUVEM · FastAPI no Railway · Supabase Postgres e Storage</text>

  <rect x="68" y="396" width="214" height="78" rx="10" fill="#E8F3F4" stroke="#0E7C86"/>
  <text x="175" y="424" font-size="14" font-weight="600" fill="#14213D" text-anchor="middle">6. Autentica</text>
  <text x="175" y="444" font-size="12" fill="#5B6B82" text-anchor="middle">hash bcrypt daquele</text>
  <text x="175" y="461" font-size="12" fill="#5B6B82" text-anchor="middle">dispositivo</text>

  <line x1="290" y1="435" x2="326" y2="435" stroke="#0E7C86" stroke-width="2" marker-end="url(#setaCloud)"/>

  <rect x="334" y="396" width="214" height="78" rx="10" fill="#E8F3F4" stroke="#0E7C86"/>
  <text x="441" y="424" font-size="14" font-weight="600" fill="#14213D" text-anchor="middle">7. Idempotência</text>
  <text x="441" y="444" font-size="12" fill="#5B6B82" text-anchor="middle">reenvio devolve o mesmo</text>
  <text x="441" y="461" font-size="12" fill="#5B6B82" text-anchor="middle">diagnóstico, sem duplicar</text>

  <line x1="556" y1="435" x2="592" y2="435" stroke="#0E7C86" stroke-width="2" marker-end="url(#setaCloud)"/>

  <!-- guarda de qualidade, destacada -->
  <rect x="600" y="390" width="256" height="90" rx="10" fill="#0E7C86"/>
  <text x="728" y="420" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">8. GUARDA DE QUALIDADE</text>
  <text x="728" y="442" font-size="12" fill="#CFE7E9" text-anchor="middle">brilho &#8805; 40 e textura &#8805; 25</text>
  <text x="728" y="461" font-size="12" fill="#CFE7E9" text-anchor="middle">custo medido: 8,8 ms</text>

  <!-- ramo aprovado -->
  <path d="M 864 414 L 912 414 L 912 400 L 952 400" fill="none" stroke="#0E7C86" stroke-width="2" marker-end="url(#setaCloud)"/>
  <text x="900" y="386" font-size="12" font-weight="600" fill="#0E7C86">aprovada</text>

  <rect x="960" y="366" width="266" height="70" rx="10" fill="#E8F3F4" stroke="#0E7C86"/>
  <text x="1093" y="392" font-size="14" font-weight="600" fill="#14213D" text-anchor="middle">9a. Inferência TFLite</text>
  <text x="1093" y="412" font-size="12" fill="#5B6B82" text-anchor="middle">MobileNetV2 · 3 classes</text>
  <text x="1093" y="429" font-size="12" fill="#5B6B82" text-anchor="middle">13,7 ms · pixels crus 0 a 255</text>

  <!-- ramo reprovado -->
  <path d="M 864 456 L 912 456 L 912 480 L 952 480" fill="none" stroke="#B4453F" stroke-width="2" marker-end="url(#setaAlerta)"/>
  <text x="896" y="504" font-size="12" font-weight="600" fill="#B4453F">reprovada</text>

  <rect x="960" y="448" width="266" height="70" rx="10" fill="#FBEFEE" stroke="#B4453F"/>
  <text x="1093" y="474" font-size="14" font-weight="600" fill="#14213D" text-anchor="middle">9b. imagem_inadequada</text>
  <text x="1093" y="494" font-size="12" fill="#5B6B82" text-anchor="middle">confiança 0,0 · nenhum</text>
  <text x="1093" y="511" font-size="12" fill="#5B6B82" text-anchor="middle">diagnóstico é afirmado</text>

  <!-- rejuncao -->
  <path d="M 1234 400 L 1280 400 L 1280 442 L 1318 442" fill="none" stroke="#0E7C86" stroke-width="2" marker-end="url(#setaCloud)"/>
  <path d="M 1234 480 L 1280 480 L 1280 442" fill="none" stroke="#B4453F" stroke-width="2"/>

  <rect x="1326" y="402" width="206" height="80" rx="10" fill="#E8F3F4" stroke="#0E7C86"/>
  <text x="1429" y="430" font-size="14" font-weight="600" fill="#14213D" text-anchor="middle">10. Storage</text>
  <text x="1429" y="450" font-size="12" fill="#5B6B82" text-anchor="middle">a foto é guardada</text>
  <text x="1429" y="467" font-size="12" fill="#5B6B82" text-anchor="middle">nos DOIS caminhos</text>

  <!-- linha de baixo da nuvem -->
  <path d="M 1429 490 L 1429 530 L 300 530 L 300 566" fill="none" stroke="#0E7C86" stroke-width="2.5" marker-end="url(#setaCloud)"/>

  <rect x="68" y="566" width="464" height="84" rx="10" fill="#E8F3F4" stroke="#0E7C86"/>
  <text x="300" y="595" font-size="14" font-weight="600" fill="#14213D" text-anchor="middle">11. Grava no Postgres, em uma transação</text>
  <text x="300" y="617" font-size="12" fill="#5B6B82" text-anchor="middle">registros_imagem · leituras_ambientais · diagnosticos</text>
  <text x="300" y="635" font-size="12" fill="#5B6B82" text-anchor="middle">a constraint UNIQUE protege contra corrida de reenvio</text>

  <line x1="540" y1="608" x2="584" y2="608" stroke="#0E7C86" stroke-width="2" marker-end="url(#setaCloud)"/>

  <rect x="592" y="566" width="420" height="84" rx="10" fill="#E8F3F4" stroke="#0E7C86"/>
  <text x="802" y="595" font-size="14" font-weight="600" fill="#14213D" text-anchor="middle">12. Gera os alertas</text>
  <text x="802" y="617" font-size="12" fill="#5B6B82" text-anchor="middle">de doença, só quando há doença classificada</text>
  <text x="802" y="635" font-size="12" fill="#5B6B82" text-anchor="middle">ambientais, a partir das leituras, sempre</text>

  <line x1="1020" y1="608" x2="1064" y2="608" stroke="#0E7C86" stroke-width="2" marker-end="url(#setaCloud)"/>

  <rect x="1072" y="566" width="460" height="84" rx="10" fill="#E8F3F4" stroke="#0E7C86"/>
  <text x="1302" y="595" font-size="14" font-weight="600" fill="#14213D" text-anchor="middle">Resposta ao dispositivo</text>
  <text x="1302" y="617" font-size="12" fill="#5B6B82" text-anchor="middle">classe prevista, confiança e recomendação</text>
  <text x="1302" y="635" font-size="12" fill="#5B6B82" text-anchor="middle">ponta a ponta medido: 1,58 s no p95</text>

  <!-- nota sobre foto reprovada -->
  <rect x="68" y="676" width="1464" height="58" rx="10" fill="#FBEFEE" stroke="#B4453F"/>
  <text x="90" y="700" font-size="13" font-weight="600" fill="#B4453F">Foto reprovada na guarda:</text>
  <text x="272" y="700" font-size="13" fill="#14213D">a imagem é guardada, as leituras são gravadas e os alertas ambientais saem normalmente. O que não acontece é</text>
  <text x="90" y="722" font-size="13" fill="#14213D">afirmar um diagnóstico. Em vez do alerta de doença, sai um alerta de câmera, e o produtor vê a própria foto no aplicativo para julgar o que houve.</text>

  <!-- ============ CAMADA 3: APLICATIVO ============ -->
  <path d="M 800 756 L 800 790" fill="none" stroke="#4C51BF" stroke-width="2.5" marker-end="url(#setaApp)"/>

  <rect x="40" y="800" width="1520" height="160" rx="12" fill="#FFFFFF" stroke="#A7B4C6"/>
  <rect x="40" y="800" width="1520" height="34" rx="12" fill="#4C51BF"/>
  <rect x="40" y="822" width="1520" height="12" fill="#4C51BF"/>
  <text x="60" y="823" font-size="14" font-weight="600" fill="#FFFFFF">APLICATIVO · React Native com Expo · consulta sob demanda</text>

  <rect x="68" y="858" width="352" height="76" rx="10" fill="#ECEDFA" stroke="#4C51BF"/>
  <text x="244" y="886" font-size="14" font-weight="600" fill="#14213D" text-anchor="middle">GET /diagnosticos</text>
  <text x="244" y="908" font-size="12" fill="#5B6B82" text-anchor="middle">com URL assinada da imagem,</text>
  <text x="244" y="925" font-size="12" fill="#5B6B82" text-anchor="middle">válida por 1 hora</text>

  <rect x="440" y="858" width="352" height="76" rx="10" fill="#ECEDFA" stroke="#4C51BF"/>
  <text x="616" y="886" font-size="14" font-weight="600" fill="#14213D" text-anchor="middle">GET /leituras</text>
  <text x="616" y="908" font-size="12" fill="#5B6B82" text-anchor="middle">série temporal de temperatura,</text>
  <text x="616" y="925" font-size="12" fill="#5B6B82" text-anchor="middle">umidade do ar e do solo</text>

  <rect x="812" y="858" width="352" height="76" rx="10" fill="#ECEDFA" stroke="#4C51BF"/>
  <text x="988" y="886" font-size="14" font-weight="600" fill="#14213D" text-anchor="middle">GET /alertas</text>
  <text x="988" y="908" font-size="12" fill="#5B6B82" text-anchor="middle">e PATCH /alertas/{id}/lido</text>
  <text x="988" y="925" font-size="12" fill="#5B6B82" text-anchor="middle">notificação local, sem push</text>

  <rect x="1184" y="858" width="348" height="76" rx="10" fill="#4C51BF"/>
  <text x="1358" y="886" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Filtro por posse</text>
  <text x="1358" y="908" font-size="12" fill="#D6D8F6" text-anchor="middle">JWT · o produtor só enxerga os</text>
  <text x="1358" y="925" font-size="12" fill="#D6D8F6" text-anchor="middle">dispositivos vinculados a ele</text>
</svg>
