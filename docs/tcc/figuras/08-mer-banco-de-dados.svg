<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" font-family="'IBM Plex Sans','Segoe UI',sans-serif">
  <defs>
    <marker id="um" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#0E7C86"/>
    </marker>
    <marker id="umLogico" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#B4453F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1140" fill="#EEF1F5"/>

  <text x="40" y="50" font-size="25" font-weight="700" fill="#14213D">Modelo entidade-relacionamento</text>
  <text x="40" y="78" font-size="14" fill="#5B6B82">Schema implementado: 8 tabelas no PostgreSQL. Chaves primárias são inteiros autoincremento (SERIAL), não UUID.</text>

  <!-- legenda -->
  <rect x="1090" y="34" width="470" height="56" rx="8" fill="#FFFFFF" stroke="#A7B4C6"/>
  <text x="1108" y="56" font-size="12" font-weight="600" fill="#14213D">PK</text>
  <text x="1134" y="56" font-size="12" fill="#5B6B82">chave primária</text>
  <text x="1240" y="56" font-size="12" font-weight="600" fill="#14213D">FK</text>
  <text x="1266" y="56" font-size="12" fill="#5B6B82">chave estrangeira</text>
  <text x="1390" y="56" font-size="12" font-weight="600" fill="#14213D">UQ</text>
  <text x="1418" y="56" font-size="12" fill="#5B6B82">único</text>
  <line x1="1108" y1="74" x2="1148" y2="74" stroke="#B4453F" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1156" y="78" font-size="12" fill="#5B6B82">vínculo lógico, sem chave estrangeira no banco</text>

  <!-- ===== usuarios ===== -->
  <rect x="40" y="130" width="300" height="192" rx="10" fill="#FFFFFF" stroke="#4C51BF" stroke-width="1.5"/>
  <rect x="40" y="130" width="300" height="34" rx="10" fill="#4C51BF"/>
  <rect x="40" y="152" width="300" height="12" fill="#4C51BF"/>
  <text x="58" y="153" font-size="14" font-weight="700" fill="#FFFFFF">usuarios</text>
  <text x="58" y="186" font-size="12.5" fill="#14213D"><tspan font-weight="700">PK</tspan>  id</text>
  <text x="58" y="208" font-size="12.5" fill="#14213D"><tspan font-weight="700">UQ</tspan>  email</text>
  <text x="58" y="230" font-size="12.5" fill="#14213D">      senha_hash</text>
  <text x="58" y="252" font-size="12.5" fill="#14213D">      papel</text>
  <text x="58" y="274" font-size="12.5" fill="#14213D">      email_verificado</text>
  <text x="58" y="296" font-size="12.5" fill="#5B6B82">      nome, criado_em</text>
  <text x="58" y="314" font-size="11" fill="#5B6B82" font-style="italic">papel: produtor | administrador</text>

  <!-- usuarios 1:N dispositivos -->
  <line x1="190" y1="322" x2="190" y2="384" stroke="#0E7C86" stroke-width="2" marker-end="url(#um)"/>
  <text x="200" y="348" font-size="12" font-weight="600" fill="#0E7C86">1</text>
  <text x="200" y="376" font-size="12" font-weight="600" fill="#0E7C86">N</text>

  <!-- ===== dispositivos ===== -->
  <rect x="40" y="390" width="300" height="258" rx="10" fill="#FFFFFF" stroke="#4C51BF" stroke-width="1.5"/>
  <rect x="40" y="390" width="300" height="34" rx="10" fill="#4C51BF"/>
  <rect x="40" y="412" width="300" height="12" fill="#4C51BF"/>
  <text x="58" y="413" font-size="14" font-weight="700" fill="#FFFFFF">dispositivos</text>
  <text x="58" y="446" font-size="12.5" fill="#14213D"><tspan font-weight="700">PK</tspan>  id</text>
  <text x="58" y="468" font-size="12.5" fill="#14213D"><tspan font-weight="700">UQ</tspan>  device_id</text>
  <text x="58" y="490" font-size="12.5" fill="#14213D"><tspan font-weight="700">FK</tspan>  usuario_id  <tspan fill="#5B6B82">(nulo)</tspan></text>
  <text x="58" y="512" font-size="12.5" fill="#14213D">      chave_hash</text>
  <text x="58" y="534" font-size="12.5" fill="#14213D"><tspan font-weight="700">UQ</tspan>  codigo_pareamento</text>
  <text x="58" y="556" font-size="12.5" fill="#14213D">      pareado_em</text>
  <text x="58" y="578" font-size="12.5" fill="#14213D">      campo, setor</text>
  <text x="58" y="600" font-size="12.5" fill="#14213D">      intervalo_captura_min</text>
  <text x="58" y="622" font-size="12.5" fill="#5B6B82">      nome, criado_em</text>
  <text x="58" y="640" font-size="11" fill="#5B6B82" font-style="italic">chave_hash: bcrypt do segredo do Pi</text>

  <!-- vinculo logico dispositivos -> registros_imagem -->
  <path d="M 348 470 L 420 470 L 420 236 L 556 236" fill="none" stroke="#B4453F" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#umLogico)"/>
  <text x="430" y="330" font-size="11.5" font-weight="600" fill="#B4453F">device_id</text>
  <text x="430" y="348" font-size="11.5" fill="#B4453F">(texto, sem FK)</text>

  <!-- ===== registros_imagem ===== -->
  <rect x="560" y="130" width="330" height="214" rx="10" fill="#FFFFFF" stroke="#0E7C86" stroke-width="2"/>
  <rect x="560" y="130" width="330" height="34" rx="10" fill="#0E7C86"/>
  <rect x="560" y="152" width="330" height="12" fill="#0E7C86"/>
  <text x="578" y="153" font-size="14" font-weight="700" fill="#FFFFFF">registros_imagem</text>
  <text x="578" y="186" font-size="12.5" fill="#14213D"><tspan font-weight="700">PK</tspan>  id</text>
  <text x="578" y="208" font-size="12.5" fill="#14213D">      device_id  <tspan fill="#5B6B82">(indexado)</tspan></text>
  <text x="578" y="230" font-size="12.5" fill="#14213D"><tspan font-weight="700">UQ</tspan>  idempotency_key</text>
  <text x="578" y="252" font-size="12.5" fill="#14213D">      caminho_arquivo</text>
  <text x="578" y="274" font-size="12.5" fill="#14213D">      capturado_em</text>
  <text x="578" y="296" font-size="12.5" fill="#5B6B82">      criado_em</text>
  <text x="578" y="320" font-size="11" fill="#5B6B82" font-style="italic">caminho_arquivo guarda o caminho no bucket,</text>
  <text x="578" y="336" font-size="11" fill="#5B6B82" font-style="italic">nunca a URL resolvida</text>

  <!-- registros 1:0..1 leituras -->
  <path d="M 724 344 L 724 392" fill="none" stroke="#0E7C86" stroke-width="2" marker-end="url(#um)"/>
  <text x="734" y="364" font-size="12" font-weight="600" fill="#0E7C86">1</text>
  <text x="734" y="388" font-size="12" font-weight="600" fill="#0E7C86">0..1</text>

  <!-- registros 1:0..1 diagnosticos -->
  <path d="M 898 236 L 1000 236 L 1000 392" fill="none" stroke="#0E7C86" stroke-width="2" marker-end="url(#um)"/>
  <text x="920" y="228" font-size="12" font-weight="600" fill="#0E7C86">1</text>
  <text x="1010" y="380" font-size="12" font-weight="600" fill="#0E7C86">0..1</text>

  <!-- ===== leituras_ambientais ===== -->
  <rect x="470" y="398" width="330" height="192" rx="10" fill="#FFFFFF" stroke="#0E7C86" stroke-width="1.5"/>
  <rect x="470" y="398" width="330" height="34" rx="10" fill="#0E7C86"/>
  <rect x="470" y="420" width="330" height="12" fill="#0E7C86"/>
  <text x="488" y="421" font-size="14" font-weight="700" fill="#FFFFFF">leituras_ambientais</text>
  <text x="488" y="454" font-size="12.5" fill="#14213D"><tspan font-weight="700">PK</tspan>  id</text>
  <text x="488" y="476" font-size="12.5" fill="#14213D"><tspan font-weight="700">FK UQ</tspan>  registro_imagem_id</text>
  <text x="488" y="498" font-size="12.5" fill="#14213D">      temperatura_c  <tspan fill="#5B6B82">(nulo)</tspan></text>
  <text x="488" y="520" font-size="12.5" fill="#14213D">      umidade_ar_pct  <tspan fill="#5B6B82">(nulo)</tspan></text>
  <text x="488" y="542" font-size="12.5" fill="#14213D">      umidade_solo_pct  <tspan fill="#5B6B82">(nulo)</tspan></text>
  <text x="488" y="564" font-size="12.5" fill="#5B6B82">      criado_em</text>
  <text x="488" y="582" font-size="11" fill="#5B6B82" font-style="italic">nulo porque falha de sensor não aborta a captura</text>

  <!-- ===== diagnosticos ===== -->
  <rect x="840" y="398" width="330" height="192" rx="10" fill="#FFFFFF" stroke="#0E7C86" stroke-width="1.5"/>
  <rect x="840" y="398" width="330" height="34" rx="10" fill="#0E7C86"/>
  <rect x="840" y="420" width="330" height="12" fill="#0E7C86"/>
  <text x="858" y="421" font-size="14" font-weight="700" fill="#FFFFFF">diagnosticos</text>
  <text x="858" y="454" font-size="12.5" fill="#14213D"><tspan font-weight="700">PK</tspan>  id</text>
  <text x="858" y="476" font-size="12.5" fill="#14213D"><tspan font-weight="700">FK UQ</tspan>  registro_imagem_id</text>
  <text x="858" y="498" font-size="12.5" fill="#14213D">      classe_prevista</text>
  <text x="858" y="520" font-size="12.5" fill="#14213D">      confianca</text>
  <text x="858" y="542" font-size="12.5" fill="#14213D">      recomendacao  <tspan fill="#5B6B82">(nulo)</tspan></text>
  <text x="858" y="564" font-size="12.5" fill="#5B6B82">      criado_em</text>
  <text x="858" y="582" font-size="11" fill="#5B6B82" font-style="italic">classe_prevista também assume imagem_inadequada</text>

  <!-- leituras 1:N alertas -->
  <path d="M 636 596 L 636 680 L 1180 680 L 1180 724" fill="none" stroke="#0E7C86" stroke-width="2" marker-end="url(#um)"/>
  <text x="648" y="620" font-size="12" font-weight="600" fill="#0E7C86">1</text>
  <text x="1190" y="712" font-size="12" font-weight="600" fill="#0E7C86">N</text>

  <!-- diagnosticos 1:N alertas -->
  <path d="M 1005 596 L 1005 648 L 1280 648 L 1280 724" fill="none" stroke="#0E7C86" stroke-width="2" marker-end="url(#um)"/>
  <text x="1017" y="620" font-size="12" font-weight="600" fill="#0E7C86">1</text>
  <text x="1290" y="712" font-size="12" font-weight="600" fill="#0E7C86">N</text>

  <!-- ===== alertas ===== -->
  <rect x="1070" y="730" width="330" height="214" rx="10" fill="#FFFFFF" stroke="#0E7C86" stroke-width="1.5"/>
  <rect x="1070" y="730" width="330" height="34" rx="10" fill="#0E7C86"/>
  <rect x="1070" y="752" width="330" height="12" fill="#0E7C86"/>
  <text x="1088" y="753" font-size="14" font-weight="700" fill="#FFFFFF">alertas</text>
  <text x="1088" y="786" font-size="12.5" fill="#14213D"><tspan font-weight="700">PK</tspan>  id</text>
  <text x="1088" y="808" font-size="12.5" fill="#14213D"><tspan font-weight="700">FK</tspan>  diagnostico_id  <tspan fill="#5B6B82">(nulo)</tspan></text>
  <text x="1088" y="830" font-size="12.5" fill="#14213D"><tspan font-weight="700">FK</tspan>  leitura_id  <tspan fill="#5B6B82">(nulo)</tspan></text>
  <text x="1088" y="852" font-size="12.5" fill="#14213D">      titulo, descricao</text>
  <text x="1088" y="874" font-size="12.5" fill="#14213D">      severidade</text>
  <text x="1088" y="896" font-size="12.5" fill="#14213D">      lido</text>
  <text x="1088" y="918" font-size="12.5" fill="#5B6B82">      criado_em</text>
  <text x="1088" y="936" font-size="11" fill="#5B6B82" font-style="italic">não tem coluna de usuário: a posse é derivada</text>

  <!-- ===== tabelas de seguranca, isoladas ===== -->
  <rect x="40" y="730" width="470" height="214" rx="10" fill="#FFFFFF" stroke="#8A94A6" stroke-dasharray="5 4"/>
  <text x="62" y="762" font-size="13" font-weight="700" fill="#5B6B82">SEM RELACIONAMENTO, por decisão de projeto</text>

  <rect x="62" y="776" width="200" height="150" rx="8" fill="#F5F6F9" stroke="#8A94A6"/>
  <text x="78" y="800" font-size="13" font-weight="700" fill="#14213D">tentativas_login</text>
  <text x="78" y="824" font-size="12" fill="#14213D"><tspan font-weight="700">PK</tspan>  email</text>
  <text x="78" y="845" font-size="12" fill="#14213D">      tentativas</text>
  <text x="78" y="866" font-size="12" fill="#14213D">      bloqueado_ate</text>
  <text x="78" y="887" font-size="12" fill="#5B6B82">      atualizado_em</text>
  <text x="78" y="910" font-size="10.5" fill="#5B6B82" font-style="italic">a chave é o e-mail DIGITADO,</text>
  <text x="78" y="923" font-size="10.5" fill="#5B6B82" font-style="italic">exista ou não a conta</text>

  <rect x="286" y="776" width="202" height="150" rx="8" fill="#F5F6F9" stroke="#8A94A6"/>
  <text x="302" y="800" font-size="13" font-weight="700" fill="#14213D">codigos_email</text>
  <text x="302" y="824" font-size="12" fill="#14213D"><tspan font-weight="700">PK</tspan>  id</text>
  <text x="302" y="845" font-size="12" fill="#14213D">      email, tipo</text>
  <text x="302" y="866" font-size="12" fill="#14213D">      codigo_hash</text>
  <text x="302" y="887" font-size="12" fill="#14213D">      expira_em, tentativas</text>
  <text x="302" y="910" font-size="10.5" fill="#5B6B82" font-style="italic">guarda o HASH do código,</text>
  <text x="302" y="923" font-size="10.5" fill="#5B6B82" font-style="italic">nunca o código em claro</text>

  <!-- ===== nota sobre a cadeia de posse ===== -->
  <rect x="540" y="730" width="500" height="214" rx="10" fill="#FBEFEE" stroke="#B4453F"/>
  <text x="562" y="762" font-size="13" font-weight="700" fill="#B4453F">A cadeia de posse, e por que ela importa</text>
  <text x="562" y="790" font-size="12.5" fill="#14213D">O controle de acesso não usa chave estrangeira direta.</text>
  <text x="562" y="810" font-size="12.5" fill="#14213D">Para saber se um produtor pode ver um alerta, o sistema</text>
  <text x="562" y="830" font-size="12.5" fill="#14213D">percorre:</text>
  <text x="574" y="858" font-size="12.5" font-weight="600" fill="#0E7C86">usuarios.id</text>
  <text x="586" y="878" font-size="12.5" fill="#14213D">&#8592; dispositivos.usuario_id</text>
  <text x="598" y="898" font-size="12.5" fill="#B4453F">&#8592; registros_imagem.device_id  (texto)</text>
  <text x="610" y="918" font-size="12.5" fill="#14213D">&#8592; diagnosticos / leituras &#8592; alertas</text>
  <text x="562" y="938" font-size="11" fill="#5B6B82" font-style="italic">Captura sem dispositivo cadastrado fica sem dono e invisível.</text>

  <!-- rodape -->
  <rect x="40" y="968" width="1360" height="128" rx="10" fill="#FFFFFF" stroke="#A7B4C6"/>
  <text x="62" y="996" font-size="13" font-weight="700" fill="#14213D">Decisões de modelagem</text>
  <text x="62" y="1022" font-size="12.5" fill="#14213D"><tspan font-weight="600">Identificadores inteiros, não UUID:</tspan> o mesmo modelo roda no PostgreSQL do Supabase e no SQLite usado nos 128 testes automatizados.</text>
  <text x="62" y="1044" font-size="12.5" fill="#14213D"><tspan font-weight="600">Relação 1 para no máximo 1</tspan> entre captura, leitura e diagnóstico: o dispositivo envia foto e sensores no mesmo ciclo, então cada captura tem no máximo um de cada.</text>
  <text x="62" y="1066" font-size="12.5" fill="#14213D"><tspan font-weight="600">Alertas com as duas chaves nulas:</tspan> um alerta nasce de um diagnóstico OU de uma leitura, e por isso nenhuma das duas colunas pode ser obrigatória.</text>
  <text x="62" y="1088" font-size="12.5" fill="#14213D"><tspan font-weight="600">Senhas, chaves de dispositivo e códigos de e-mail só existem como hash:</tspan> se o banco vazar, nenhum deles serve para entrar no sistema.</text>
</svg>
