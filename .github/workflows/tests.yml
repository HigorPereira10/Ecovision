name: Testes automatizados (edge + cloud)

# Roda em todo push, sem filtro de caminho: a implantação no Railway
# aguarda estes checks (Wait for CI), então todo commit precisa de um
# resultado.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  edge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # mesma versão de .python-version
      # Só as dependências de teste: edge/requirements.txt inclui pacotes
      # do Raspberry Pi que não se instalam no runner.
      - run: pip install -r edge/tests/requirements-test.txt
      - run: pytest edge/tests -v

  cloud-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r cloud/requirements.txt -r cloud/tests/requirements-test.txt
      - working-directory: cloud
        run: pytest tests -v
